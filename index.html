<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>한마을 · 테스트 버전</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <style>
    html, body { margin: 0; height: 100%; background: #2b2420; overflow: hidden; font-family: system-ui, sans-serif; }
    #stage { height: 100%; display: flex; align-items: center; justify-content: center; }
    /* 폰 비율(390x844)을 유지하고, 폰 화면에서는 꽉 채운다 */
    #frame { position: relative; height: min(100vh, 900px); aspect-ratio: 390 / 844; max-width: 100vw; background: #FFF8F0; }
    @media (max-aspect-ratio: 1/1) and (max-width: 600px) { #frame { height: 100%; width: 100%; aspect-ratio: auto; } }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #FFF8F0; color: #E8743B; font-weight: 700; }
    #loading .bar { width: 55%; height: 8px; border-radius: 4px; background: #F0E2D3; margin-top: 18px; overflow: hidden; }
    #loading .bar i { display: block; height: 100%; width: 0; background: #E8743B; }
    #loading small { color: #9A8B80; font-weight: 400; margin-top: 14px; }
    #err { position: absolute; left: 12px; right: 12px; bottom: 12px; background: #C0392B; color: #fff; padding: 10px; border-radius: 8px; display: none; font-size: 13px; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="frame">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading"><div style="font-size:28px">한마을</div><div class="bar"><i id="bar"></i></div><small>처음에는 30MB 정도 내려받아요</small></div>
      <div id="err"></div>
    </div>
  </div>
  <script>
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/WebGL.data",
      frameworkUrl: buildUrl + "/WebGL.framework.js",
      codeUrl: buildUrl + "/WebGL.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "HanMaeul", productName: "한마을", productVersion: "0.1",
      showBanner: function (msg, type) { if (type === "error") { var e = document.getElementById("err"); e.style.display = "block"; e.textContent = msg; } }
    };
    var s = document.createElement("script");
    s.src = buildUrl + "/WebGL.loader.js";
    s.onload = function () {
      createUnityInstance(document.getElementById("unity-canvas"), config, function (p) {
        document.getElementById("bar").style.width = (p * 100) + "%";
      }).then(function () {
        document.getElementById("loading").style.display = "none";
      }).catch(function (m) { alert(m); });
    };
    document.body.appendChild(s);
  </script>
</body>
</html>
